service: typescript-node-lambda-base

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    platform: node

functions:
  heartbeat:
    handler: src/functions/heartbeat.handler
    events:
      - http:
          path: /heartbeat
          method: GET
